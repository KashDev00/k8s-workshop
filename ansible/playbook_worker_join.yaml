---
# -----------------------------------------------------------------------
# Play 1: Generate Token on a Control Plane Node
# -----------------------------------------------------------------------
- name: Get Join Token from Control Plane
  hosts: controlplane[0]
  become: true
  tasks:
    - name: Create Join Token
      command: kubeadm token create --print-join-command
      register: join_command_output

    - name: Set Join Command
      set_fact:
        join_cmd: "{{ join_command_output.stdout }}"

    - name: Store Join Command
      add_host:
        name: "JOIN_HOLDER"
        join_cmd: "{{ join_cmd }}"

# -----------------------------------------------------------------------
# Play 2: Join Worker Nodes
# -----------------------------------------------------------------------
- name: Join Worker Nodes
  hosts: workers
  become: true
  tasks:
    - name: Check if node is already part of cluster
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Fetch true OpenStack instance name from Metadata API
      shell: curl -s http://169.254.169.254/latest/meta-data/hostname | cut -d. -f1
      register: openstack_hostname
      when: not kubelet_conf.stat.exists

    - name: Join the Cluster
      shell: "{{ hostvars['JOIN_HOLDER']['join_cmd'] }} --node-name={{ openstack_hostname.stdout }}"
      when: not kubelet_conf.stat.exists
      register: join_output

    - name: Print Join Success
      debug:
        msg: "Worker joined successfully: {{ join_output.stdout }}"
      when: not kubelet_conf.stat.exists
