---
- name: Gather Facts from Workers
  hosts: workers
  gather_facts: true

- name: Configure HAProxy Load Balancer
  hosts: loadbalancer
  become: true
  tasks:
    - name: Install HAProxy
      apt:
        name: haproxy
        state: present
        update_cache: yes
      register: apt_res
      until: apt_res is success
      retries: 30
      delay: 15

    - name: Create HAProxy Configuration
      template:
        src: templates/haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        mode: '0644'
      notify: Restart HAProxy

    - name: Configure Policy Routing for Floating IP
      copy:
        dest: /etc/netplan/60-policy-routing.yaml
        content: |
          network:
            version: 2
            ethernets:
              enp4s0:
                routing-policy:
                  - from: {{ ansible_enp4s0.ipv4.address }}
                    table: 102
                routes:
                  - to: default
                    via: 10.0.50.1
                    table: 102
        mode: '0644'
      notify: Apply Netplan

  handlers:
    - name: Restart HAProxy
      systemd:
        name: haproxy
        state: restarted
        enabled: yes

    - name: Apply Netplan
      command: netplan apply
